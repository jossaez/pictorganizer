
name: Build Android Release AAB

on:

  workflow_dispatch:

jobs:

  build:

    name: Build signed release AAB

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository

        uses: actions/checkout@v4

      - name: Setup Node.js

        uses: actions/setup-node@v4

        with:

          node-version: 22

          cache: npm

      - name: Setup Java 21

        uses: actions/setup-java@v4

        with:

          distribution: temurin

          java-version: 21

      - name: Setup Android SDK

        uses: android-actions/setup-android@v3

      - name: Install dependencies

        run: npm ci

      - name: Typecheck

        run: npm run typecheck

      - name: Run tests

        run: npm test -- --run

      - name: Build web app

        run: npm run build

      - name: Sync Capacitor Android

        run: npx cap sync android

      - name: Restore release keystore

        run: |

          mkdir -p android/app/keystores

          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystores/pictorganizer-release.jks

          test -f android/app/keystores/pictorganizer-release.jks

          ls -la android/app/keystores

      - name: Make Gradle executable

        run: chmod +x android/gradlew

      - name: Build signed Android release bundle

        working-directory: android

        run: ./gradlew bundleRelease -Pandroid.injected.signing.store.file=keystores/pictorganizer-release.jks -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Upload signed release AAB

        uses: actions/upload-artifact@v4

        with:

          name: pictorganizer-signed-release-aab

          path: android/app/build/outputs/bundle/release/app-release.aab

